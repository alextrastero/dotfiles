onboarding = false

[theme]
name = "terminal"
# kitty answers the appearance query from its background luminance, so this tracks the kitty theme
auto_switch = true
dark_name = "terminal"
light_name = "terminal"

[theme.custom]
active_row_bg = "reset"

# panel_bg paints the tab bar/overlays and is also the active-tab text on the blue accent.
# reset would make that text surface_dim (ANSI dark gray), unreadable, so match the kitty background instead.
[theme.custom.dark]
panel_bg = "#323d43" # everforest

[theme.custom.light]
panel_bg = "#fbf1c7" # gruvbox-light

[keys]
split_horizontal = "prefix+s"
settings = "prefix+shift+s"
next_agent = "prefix+a"
previous_agent = "prefix+shift+a"
focus_pane_left = "ctrl+h"
focus_pane_down = "ctrl+j"
focus_pane_up = "ctrl+k"
focus_pane_right = "ctrl+l"
goto = ""

[[keys.command]]
key = "prefix+g"
type = "plugin_action"
command = "chmarax.gitview.toggle-tab"
description = "git view tab"

[[keys.command]]
key = "prefix+alt+g"
type = "plugin_action"
command = "chmarax.gitview.toggle"
description = "git view sidebar"

[ui]
prompt_new_tab_name = false
sidebar_collapsed_mode = "hidden"
sidebar_start_collapsed = true
pane_gaps = false
pane_outer_borders = false
show_agent_labels_on_pane_borders = true
tab_bar_position = "bottom"
tab_bar_right = [
  { type = "zoom" },
  { type = "command", interval_seconds = 5, command = "git branch --show-current 2>/dev/null" },
  { type = "command", interval_seconds = 60, command = "cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | sed 's/$/%/'" },
  { type = "datetime", format = "%H:%M" },
]
tab_bar_right_separator = " · "
mouse_scroll_lines = 1

[ui.sidebar.agents.rows_by_agent]
claude = [
  ["state_icon", "workspace", "tab"],
  ["terminal_title_stripped"],
]
pi = [
  ["state_icon", "workspace", "tab"],
  ["terminal_title_stripped"],
]

[ui.sound]
enabled = false
