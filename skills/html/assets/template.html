<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dudley Estates — SEO Audit Report</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sidebar-w: 280px;
      --header-h: 56px;
      --navy: #1e3a5f;
      --navy-light: #2a4f7f;
      --border: #e2e8f0;
      --bg: #f8fafc;
      --text: #1e293b;
      --muted: #64748b;
      --red: #ef4444;
      --amber: #f59e0b;
      --green: #22c55e;
      --blue: #3b82f6;
    }

    html, body { height: 100%; overflow: hidden; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      font-size: 0.9375rem;
      display: flex;
      flex-direction: column;
    }

    /* ── TOP BAR ── */
    #topbar {
      height: var(--header-h);
      min-height: var(--header-h);
      background: var(--navy);
      color: #fff;
      display: flex;
      align-items: center;
      padding: 0 1.5rem;
      gap: 1rem;
      z-index: 20;
    }
    #topbar h1 { font-size: 1rem; font-weight: 700; flex: 1; }
    #topbar .meta { font-size: 0.75rem; opacity: 0.65; }
    #topbar .updated { font-size: 0.75rem; opacity: 0.65; white-space: nowrap; }

    /* ── BODY LAYOUT ── */
    #layout {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* ── SIDEBAR ── */
    #sidebar {
      width: var(--sidebar-w);
      min-width: var(--sidebar-w);
      background: #fff;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    #sidebar-header {
      padding: 1rem 1.25rem 0.75rem;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: #fff;
      z-index: 5;
    }
    #sidebar-header p {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }
    #prop-nav { list-style: none; padding: 0.5rem 0; }
    #prop-nav li a {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.6rem 1.25rem;
      text-decoration: none;
      color: var(--text);
      font-size: 0.85rem;
      border-left: 3px solid transparent;
      transition: background 0.1s;
    }
    #prop-nav li a:hover { background: var(--bg); }
    #prop-nav li a.active { border-left-color: var(--navy); background: #eff6ff; color: var(--navy); font-weight: 600; }
    #prop-nav li a .ref { font-size: 0.7rem; color: var(--muted); display: block; }
    #prop-nav li a .prop-title { flex: 1; line-height: 1.3; }
    .score-pill {
      font-size: 0.7rem;
      font-weight: 700;
      color: #fff;
      padding: 0.15rem 0.45rem;
      border-radius: 9999px;
      white-space: nowrap;
    }
    .pill-red   { background: var(--red); }
    .pill-amber { background: var(--amber); }
    .pill-green { background: var(--green); }

    /* ── MAIN CONTENT ── */
    #content {
      flex: 1;
      overflow-y: auto;
      padding: 2rem 2.5rem;
      display: flex;
      flex-direction: column;
      gap: 3rem;
    }

    /* ── PROPERTY SECTION ── */
    .prop-section { display: flex; flex-direction: column; gap: 1.5rem; }

    .prop-header {
      border-bottom: 2px solid var(--navy);
      padding-bottom: 0.75rem;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
    }
    .prop-header h2 { font-size: 1.2rem; font-weight: 700; color: var(--navy); }
    .prop-header a  { font-size: 0.75rem; color: var(--muted); word-break: break-all; display: block; margin-top: 0.2rem; }
    .prop-header .audit-date { font-size: 0.75rem; color: var(--muted); margin-top: 0.2rem; }
    .score-badge {
      font-size: 1.3rem;
      font-weight: 800;
      color: #fff;
      padding: 0.4rem 1rem;
      border-radius: 0.5rem;
      white-space: nowrap;
    }
    .badge-red   { background: var(--red); }
    .badge-amber { background: var(--amber); }
    .badge-green { background: var(--green); }

    /* ── CARDS ROW ── */
    .cards-row {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem;
    }
    .stat-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 1rem 1.25rem;
    }
    .stat-card .label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin-bottom: 0.3rem; }
    .stat-card .value { font-size: 1.1rem; font-weight: 700; color: var(--text); }
    .stat-card .sub   { font-size: 0.75rem; color: var(--muted); margin-top: 0.15rem; }

    /* ── SEVERITY BLOCKS ── */
    .severity-block { display: flex; flex-direction: column; gap: 1rem; }
    .severity-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 0.4rem 0;
      border-bottom: 1px solid var(--border);
    }
    .severity-label.crit  { color: var(--red); border-color: var(--red); }
    .severity-label.high  { color: var(--amber); border-color: var(--amber); }
    .severity-label.med   { color: var(--blue); border-color: var(--blue); }
    .severity-label.good  { color: var(--green); border-color: var(--green); }

    /* ── FINDING CARD ── */
    .finding {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      overflow: hidden;
    }
    .finding-header {
      padding: 0.75rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      border-bottom: 1px solid var(--border);
    }
    .finding-header .verdict { font-size: 1.1rem; flex-shrink: 0; }
    .finding-header h3 { font-size: 0.9rem; font-weight: 700; color: var(--text); flex: 1; }
    .finding-body { padding: 0.9rem 1rem; font-size: 0.875rem; color: #334155; display: flex; flex-direction: column; gap: 0.6rem; }
    .finding-body p { margin: 0; }

    .fix-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 0.375rem;
      padding: 0.6rem 0.9rem;
      font-size: 0.825rem;
    }
    .fix-box .fix-label { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin-bottom: 0.25rem; }

    .paste-box {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 0.375rem;
      padding: 0.6rem 0.9rem;
      font-size: 0.825rem;
      color: #166534;
    }
    .paste-box .paste-label { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: #16a34a; margin-bottom: 0.25rem; }

    /* ── FULL CHECK TABLE ── */
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; background: #fff; border: 1px solid var(--border); border-radius: 0.5rem; overflow: hidden; }
    thead th {
      text-align: left;
      padding: 0.55rem 0.75rem;
      background: var(--bg);
      color: var(--muted);
      font-weight: 600;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid var(--border);
    }
    tbody td { padding: 0.5rem 0.75rem; border-bottom: 1px solid #f1f5f9; vertical-align: top; }
    tbody tr:last-child td { border-bottom: none; }

    /* ── CODE ── */
    code { font-family: ui-monospace, monospace; font-size: 0.82em; background: #f1f5f9; padding: 0.1em 0.35em; border-radius: 0.25rem; }
    pre {
      background: #f1f5f9;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 1rem 1.25rem;
      overflow-x: auto;
      font-family: ui-monospace, monospace;
      font-size: 0.8rem;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-all;
    }
    pre code { background: none; padding: 0; }

    /* ── CHANGE LOG ── */
    .change-log { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 0.75rem; }
    .change-log li {
      background: #fff;
      border: 1px solid var(--border);
      border-left: 3px solid var(--navy);
      border-radius: 0 0.5rem 0.5rem 0;
      padding: 0.75rem 1rem;
      font-size: 0.85rem;
    }
    .change-log .cl-date  { font-size: 0.7rem; color: var(--muted); margin-bottom: 0.2rem; }
    .change-log .cl-what  { font-weight: 700; color: var(--text); }
    .change-log .cl-why   { color: #475569; margin-top: 0.2rem; }
    .change-log .cl-diff  { font-family: ui-monospace, monospace; font-size: 0.78rem; background: var(--bg); border: 1px solid var(--border); border-radius: 0.375rem; padding: 0.4rem 0.7rem; margin-top: 0.4rem; }
    .change-log .cl-diff .before { color: var(--red); display: block; }
    .change-log .cl-diff .after  { color: var(--green); display: block; }

    /* ── EMPTY STATE ── */
    .empty-cl { font-size: 0.85rem; color: var(--muted); font-style: italic; padding: 0.5rem 0; }

    /* ── SECTION TITLES ── */
    .section-title {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }

    /* ── SCROLL ANCHOR OFFSET ── */
    .prop-section { scroll-margin-top: 1.5rem; }

    /* ── PRINT ── */
    @media print {
      @page { margin: 1.5cm; }
      html, body { height: auto; overflow: visible; }
      #topbar { background: #fff; color: #000; border-bottom: 2px solid #000; }
      #topbar h1 { font-size: 1rem; }
      #layout { display: block; }
      #sidebar { display: none; }
      #content { overflow: visible; padding: 0; }
      .finding { page-break-inside: avoid; }
      table { page-break-inside: avoid; }
      pre { border: 1px solid #ccc; background: #f5f5f5; }
      code { background: #f5f5f5; }
      a { color: #000; text-decoration: none; }
      .score-badge { border: 2px solid #000; color: #000; background: none !important; }
    }
  </style>
</head>
