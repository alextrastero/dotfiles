# Hide the Sharkoon USB sound card: WirePlumber kept switching the default output to it
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "alsa_card.usb-Sharkoon_Technologies_Sharkoon_7.1_Sound_Extension-00" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
